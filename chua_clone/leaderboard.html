<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng công đức</title>
<style>
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 400; font-display: swap;
    src: url("/assets/vendor/fonts/be-vietnam-pro-vietnamese-400-normal.woff2") format("woff2");
    unicode-range: U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB; }
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 400; font-display: swap;
    src: url("/assets/vendor/fonts/be-vietnam-pro-latin-400-normal.woff2") format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 900; font-display: swap;
    src: url("/assets/vendor/fonts/be-vietnam-pro-vietnamese-900-normal.woff2") format("woff2");
    unicode-range: U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB; }
  @font-face { font-family: "Be Vietnam Pro"; font-weight: 900; font-display: swap;
    src: url("/assets/vendor/fonts/be-vietnam-pro-latin-900-normal.woff2") format("woff2");
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

  :root {
    --lacquer: rgba(26, 17, 13, 0.82);
    --ember: #5a3a22;
    --gold: #f5d06f;
    --ivory: #f6ead9;
    --lotus: #ee9db4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }  /* trong suốt để đặt lên cảnh chùa trong OBS */
  body {
    font-family: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
    color: var(--ivory);
    padding: 16px;
    width: 420px;
    max-width: 100%;
  }
  .board {
    background: var(--lacquer);
    border: 2px solid var(--gold);
    border-radius: 14px;
    padding: 16px 18px 12px;
    box-shadow: 0 0 0 4px rgba(245, 208, 111, 0.18);
  }
  h1 {
    margin: 0 0 12px;
    font-size: 22px;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 0.01em;
  }
  ol { list-style: none; margin: 0; padding: 0; }
  li {
    display: grid;
    grid-template-columns: 30px 1fr auto;
    align-items: baseline;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid var(--ember);
    font-size: 17px;
  }
  li:first-child { border-top: 0; }
  .rank { color: var(--gold); font-weight: 900; text-align: center; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pts { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 900; }
  /* Hạng nhất là điểm nhấn duy nhất của bảng */
  li.top .rank::before { content: "🪷"; }
  li.top .rank span { display: none; }
  li.top .name { color: var(--lotus); font-weight: 900; font-size: 19px; }
  .note { margin: 10px 0 2px; font-size: 14px; color: #d8bfa6; line-height: 1.5; }
  .note[hidden] { display: none; }
</style>
</head>
<body>
  <section class="board" aria-live="polite">
    <h1>Bảng công đức</h1>
    <ol id="rows"></ol>
    <p class="note" id="note" hidden></p>
  </section>

<script>
  // Tham số: ?top=5 (số người hiển thị, 1-10)  &refresh=5 (giây giữa các lần cập nhật, tối thiểu 2)
  var params = new URLSearchParams(location.search);
  var topN = Math.max(1, Math.min(10, parseInt(params.get('top'), 10) || 5));
  var refresh = Math.max(2, parseInt(params.get('refresh'), 10) || 5) * 1000;
  var rowsEl = document.getElementById('rows');
  var noteEl = document.getElementById('note');

  function showNote(text) {
    noteEl.textContent = text;
    noteEl.hidden = !text;
  }

  async function update() {
    try {
      var res = await fetch('/api/leaderboard?limit=' + topN, { cache: 'no-store' });
      if (!res.ok) throw new Error('http ' + res.status);
      var data = await res.json();
      rowsEl.textContent = '';
      if (!data.rows.length) {
        showNote('Chưa có phật tử nào dâng cúng. Món quà hoặc trái tim đầu tiên sẽ lên bảng này.');
        return;
      }
      showNote('');
      data.rows.forEach(function (r) {
        var li = document.createElement('li');
        if (r.rank === 1) li.className = 'top';
        var rank = document.createElement('span');
        rank.className = 'rank';
        var rankNum = document.createElement('span');
        rankNum.textContent = r.rank;
        rank.appendChild(rankNum);
        var name = document.createElement('span');
        name.className = 'name';
        name.textContent = r.name;          // textContent: tên khán giả không bao giờ được chạy như mã HTML
        var pts = document.createElement('span');
        pts.className = 'pts';
        pts.textContent = r.points.toLocaleString('vi-VN');
        li.appendChild(rank); li.appendChild(name); li.appendChild(pts);
        rowsEl.appendChild(li);
      });
    } catch (e) {
      showNote('Mất kết nối với máy chủ, đang thử lại...');
    }
  }
  update();
  setInterval(update, refresh);
</script>
</body>
</html>
